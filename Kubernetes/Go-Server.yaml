apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-mail-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mail-pipeline
  template:
    metadata:
      labels:
        app: mail-pipeline
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: go-mail-app
        image: finops-go-mailer:latest
        imagePullPolicy: Never
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mail-service
spec:
  selector:
    app: mail-pipeline
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      